<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">

</div>
</div>
<!-- Absolute decorative elements -->
<div class="absolute bottom-12 left-12 flex items-center space-x-4 opacity-40">
<div class="w-2 h-2 rounded-full bg-primary-fixed-dim"></div>
<div class="w-2 h-2 rounded-full bg-white/20"></div>
<div class="w-2 h-2 rounded-full bg-white/20"></div>
</div>
</section>
<!-- Right Panel: The Canvas -->
<section class="w-full lg:w-[45%] bg-surface-container-lowest flex flex-col justify-center items-center relative p-8 md:p-16">
<div class="w-full max-w-[400px] flex flex-col">
<!-- Header Section -->
<div class="mb-10 text-left">
<h2 class="text-[#0F172A] text-2xl font-bold tracking-tight mb-2">欢迎登录</h2>
<p class="text-[#475569] text-sm">请选择登录方式</p>
</div>
<!-- Tabs Container -->
<div class="relative flex border-b border-surface-container-highest mb-8">
<button class="flex-1 py-3 text-sm font-medium text-primary transition-colors focus:outline-none" id="wechat-tab">
                        微信扫码登录
                    </button>
<button class="flex-1 py-3 text-sm font-medium text-on-surface-variant hover:text-primary transition-colors focus:outline-none" id="account-tab">
                        账号密码登录
                    </button>
<!-- Animated Underline Indicator -->
<div class="active-tab-indicator w-1/2 left-0"></div>
</div>
<!-- Tab Content: WeChat (Default) -->
<div class="flex flex-col items-center" id="wechat-content">
<div class="p-4 bg-white border border-surface-container-highest rounded-lg shadow-sm mb-6 transition-all duration-300 hover:shadow-md">
<div class="w-[200px] h-[200px] bg-surface-container-low flex items-center justify-center relative group">

<div class="absolute inset-0 bg-white/80 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="refresh">refresh</span>
</div>
</div>
</div>
<div class="flex items-center space-x-2 text-[#94A3B8]">

</div>
</div>
<!-- Tab Content: Account (Hidden by default, structure provided) -->
<form class="hidden space-y-6" id="account-content">
<div class="space-y-1.5">
<label class="block text-[0.75rem] font-bold text-on-surface-variant uppercase tracking-wider">用户名/手机号</label>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface-container-highest border-none rounded-lg text-sm focus:ring-2 focus:ring-primary-fixed-dim focus:bg-white transition-all outline-none" placeholder="请输入您的账号" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-[0.75rem] font-bold text-on-surface-variant uppercase tracking-wider">密码</label>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface-container-highest border-none rounded-lg text-sm focus:ring-2 focus:ring-primary-fixed-dim focus:bg-white transition-all outline-none" placeholder="请输入登录密码" type="password"/>

</button>
</div>
</div>
<div class="flex items-center justify-between py-1">
<label class="flex items-center cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary-container" type="checkbox"/>
</div>

</label>

</div>

                </p>

</div>
</footer>

</main>
<!-- Custom Interaction Logic for Tabs (CSS-only trigger mechanism would be complex, adding simple data state toggle visually) -->
<style>
        /* This CSS simulates the tab switching for preview purposes without JS */
        #account-tab:focus ~ #wechat-content { display: none; }
        #account-tab:focus ~ #account-content { display: block; }
        #account-tab:focus ~ .active-tab-indicator { left: 50%; }
        
        /* Account content toggle mock implementation */
        #account-tab:active ~ #wechat-content,
        #account-tab:focus ~ #wechat-content {
            display: none !important;
        }
        #account-tab:active ~ #account-content,
        #account-tab:focus ~ #account-content {
            display: flex !important;
        }
    </style>
<script>
        // Optional: Minimal interaction script to make the static HTML feel functional for demonstration
        document.getElementById('wechat-tab').addEventListener('click', function() {
            document.getElementById('wechat-content').classList.remove('hidden');
            document.getElementById('account-content').classList.add('hidden');
            document.querySelector('.active-tab-indicator').style.left = '0';
            this.classList.add('text-primary');
            this.classList.remove('text-on-surface-variant');
            document.getElementById('account-tab').classList.remove('text-primary');
            document.getElementById('account-tab').classList.add('text-on-surface-variant');
        });

        document.getElementById('account-tab').addEventListener('click', function() {
            document.getElementById('wechat-content').classList.add('hidden');
            document.getElementById('account-content').classList.remove('hidden');
            document.getElementById('account-content').classList.add('flex');
            document.querySelector('.active-tab-indicator').style.left = '50%';
            this.classList.add('text-primary');
            this.classList.remove('text-on-surface-variant');
            document.getElementById('wechat-tab').classList.remove('text-primary');
            document.getElementById('wechat-tab').classList.add('text-on-surface-variant');
        });
    </script>
