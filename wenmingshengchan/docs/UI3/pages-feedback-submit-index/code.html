            min-height: 100vh;

            opacity: 0.03;

            background: rgba(255, 255, 255, 0.25);

<main class="pt-8 pb-32 px-4 max-w-2xl mx-auto">

</div>

</div>
<div class="grid grid-cols-2 gap-4 border-t border-white/20 pt-4">
<div>
<p class="text-[10px] text-on-surface-variant mb-0.5">负责人</p>
<p class="text-sm font-medium">张建国 (工号: 8812)</p>
</div>
<div>
<p class="text-[10px] text-on-surface-variant mb-0.5">部门及小组</p>
<p class="text-sm font-medium">采一作业区 运转甲班</p>
</div>
</div>
</section>
<div class="mb-6">
<button class="w-[40%] bg-error text-white text-xs font-bold py-2.5 rounded-lg shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-1.5 mx-auto"><span class="material-symbols-outlined text-[16px]" data-icon="info">info</span>该点位上传标准[必看]</button>
</div>
<section class="mb-6">
<div class="flex items-center justify-between mb-3 px-1">

<span class="material-symbols-outlined text-[18px]" data-icon="photo_camera">photo_camera</span>

</div>
<div class="glass-card rounded-xl p-4 flex flex-col gap-4">
<div class="relative w-full aspect-video rounded-lg border-2 border-dashed border-outline-variant bg-white/10 flex flex-col items-center justify-center hover:bg-white/20 transition-all duration-300 group cursor-pointer overflow-hidden">
<span class="material-symbols-outlined text-4xl text-primary/40 group-hover:scale-110 transition-transform duration-300" data-icon="add_a_photo">add_a_photo</span>
<p class="mt-2 text-sm font-medium text-on-surface-variant">点击上传主现场照片</p>

<span class="material-symbols-outlined text-[14px]" data-icon="close">close</span>
</button>
</div>
<div class="flex-shrink-0 w-20 h-20 rounded-lg border-2 border-dashed border-outline-variant/50 bg-white/5 flex items-center justify-center">
<span class="material-symbols-outlined text-outline-variant text-[20px]" data-icon="image">image</span>
</div>
<div class="flex-shrink-0 w-20 h-20 rounded-lg border-2 border-dashed border-outline-variant/50 bg-white/5 flex items-center justify-center">
<span class="material-symbols-outlined text-outline-variant text-[20px]" data-icon="image">image</span>
</div>
</div>
</div>
</section>
<section class="mb-10">

<span class="material-symbols-outlined text-[18px]" data-icon="edit_note">edit_note</span>

<button class="p-1 hover:bg-primary/10 rounded transition-colors"><span class="material-symbols-outlined text-[20px] text-on-surface-variant" data-icon="format_bold">format_bold</span></button>
<button class="p-1 hover:bg-primary/10 rounded transition-colors"><span class="material-symbols-outlined text-[20px] text-on-surface-variant" data-icon="format_italic">format_italic</span></button>

<button class="p-1 hover:bg-primary/10 rounded transition-colors ml-auto"><span class="material-symbols-outlined text-[20px] text-on-surface-variant" data-icon="undo">undo</span></button>
</div>
<div class="p-4 bg-white/10 min-h-[180px]">
<textarea class="w-full bg-transparent border-none focus:ring-0 text-sm text-on-surface placeholder:text-on-surface-variant/40 leading-relaxed resize-none h-full" placeholder="在此详细描述现场文明生产执行情况，包括但不限于：物料堆放、地面清洁度、员工合规状态等..."></textarea>
</div>
</div>
</section>

<span class="material-symbols-outlined" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>

<div class="flex flex-col items-center justify-center text-slate-500 px-3 py-1">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-inter text-[10px] tracking-wider">首页</span>
</div>
<div class="flex flex-col items-center justify-center text-blue-700 font-bold bg-blue-50/30 rounded-xl px-3 py-1">
